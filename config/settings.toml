# GoldBot settings.
# Broker-specific values come from MT5: right-click XAUUSD -> Specification.
# If you change broker, this file is the ONLY place that should need editing.

[symbol]
name = "XAUUSD"
digits = 2               # decimal places in the price (3000.45 -> 2)
contract_size = 100.0    # ounces of gold in 1.00 lot
tick_size = 0.01         # smallest price step, in $
# $ P/L of a one-tick ($0.01) move on 1.00 lot. MT5's Specification window displays 0.1, but a
# live demo test proved 1.0: 0.01 lot, 4095.12 -> 4097.20 (+$2.08 move) = +$2.08 profit (2026-11-09).
# Re-verify with a real trade (and mt5.symbol_info().trade_tick_value) whenever the broker changes.
tick_value = 1.0
volume_min = 0.01        # smallest order, in lots
volume_step = 0.01       # lot sizes must be a multiple of this
volume_max = 100.0       # largest single order, in lots
stops_level = 0          # min distance (points) between price and SL/TP; 0 = no minimum
spread_type = "floating" # spread changes with market conditions
profit_currency = "USD"
margin_currency = "USD"
swap_long = -12.6        # overnight fee for holding a buy (charged at rollover)
swap_short = -4.6        # overnight fee for holding a sell
trading_session = "00:00-23:00"   # server time; the gap 23:00-00:00 is the daily break

[strategy]
timeframe = "H1"
ema_fast = 20            # short-term trend (entry trigger, with ema_slow)
ema_slow = 50
ema_trend = 200          # big-picture trend filter
atr_period = 14          # volatility, used to size the stop loss
sl_atr_mult = 1.5        # stop loss distance = 1.5 x ATR
reward_risk = 2.0        # take profit distance = 2 x stop distance ("2R")
# Session filter: only ENTER trades when the entry time (= signal bar's close) is within
# [session_start_hour, session_end_hour) in SERVER time. Server - 7h = New York, server - 2h ~ London.
# 10:00-20:00 server ~ 08:00 London open to 13:00 New York (the busiest hours, see check_data.py).
use_session_filter = true
session_start_hour = 10
session_end_hour = 20

[risk]
risk_per_trade_pct = 1.0       # target: lose this % of equity if the stop loss is hit
# Hard ceiling. If even the minimum lot (0.01) would risk more than this %, SKIP the trade.
# Matters for small accounts: on $2,547 a $26 stop at 0.01 lot already risks ~1.02%.
max_risk_per_trade_pct = 1.5

[backtest]
initial_equity = 3000.0    # matches the planned live account (D-10)
# Pessimistic costs. The bar's own spread is used if it's WIDER than this floor.
min_spread_points = 25     # $0.25. Demo median is only 5-8 points; real retail accounts are often wider.
slippage_points = 5        # $0.05 worse on every market entry and every stop-loss exit
commission_per_lot = 0.0   # $ per 1.00 lot, round trip (MetaQuotes-Demo charges none; ECN brokers do)
# Swap comes from [symbol] swap_long / swap_short (points per lot per night).

[data]
# Paths are relative to the project root.
h1_file = "data/raw/XAUUSD_H1.csv"
m15_file = "data/raw/XAUUSD_M15.csv"
# Server time zone (from scripts/check_data.py + export timestamp, 2026-11-09):
#   export saved 08:12 UTC, last bar stamped 10:00 server time  ->  server = UTC+2 now (US winter).
#   Most brokers switch to UTC+3 during US daylight saving; confirm when we build the session filter.
#   New York time = server time - 7h all year round.
server_utc_offset_hours = 2
# Daily break: ~23:00-00:00 server time until early 2026, then 22:00-01:00 (bars run 01:00-22:00).
