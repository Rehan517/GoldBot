[project]
name = "goldbot"
version = "0.1.0"
description = "Rule-based XAUUSD trading bot for MetaTrader 5"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Where pytest looks for test files.
testpaths = ["tests"]
# Add the project root to Python's import path so tests can do `import goldbot`.
pythonpath = ["."]
